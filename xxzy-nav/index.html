<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全民数字素养与技能教育 · 资源导航</title>
<style>
:root{--a:#00e5ff;--b:#7c4dff;--p:#ff4fa3;--g:#38f2a0;--bg:#070b1a;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.6 "Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:#e8ecff;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.4;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
.o1{width:520px;height:520px;background:var(--b);left:-130px;top:-110px}
.o2{width:460px;height:460px;background:#00b8d4;right:-110px;top:22%;animation-delay:-6s}
.o3{width:400px;height:400px;background:var(--p);left:32%;bottom:-170px;animation-delay:-12s;opacity:.28}
@keyframes float{50%{transform:translate(60px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:0 22px}
header{padding:54px 0 14px;text-align:center}
header .eyebrow{letter-spacing:.4em;font-size:12px;color:var(--a);text-transform:uppercase}
header h1{margin:10px 0 12px;font-size:clamp(30px,5.4vw,58px);font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--b),var(--p),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
header p{margin:0 auto;max-width:760px;color:#9aa6d6;text-wrap:pretty}
.stats{display:flex;justify-content:center;gap:12px;margin:24px 0 6px;flex-wrap:wrap}
.stat{padding:10px 24px;border-radius:16px;background:var(--glass);border:1px solid var(--line);min-width:124px}
.stat b{display:block;font-size:28px;line-height:1.15;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:#8e9bc8}
.panel{position:relative;z-index:5;margin:8px 0 4px;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.grp{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.grp:last-of-type{border-bottom:0}
.lbl{flex:0 0 62px;padding-top:5px;font-size:12.5px;color:#8b98c6;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cfd6ff;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:12.5px;transition:.2s;font-family:inherit}
.chips button:hover{border-color:var(--a);box-shadow:0 0 14px rgba(0,229,255,.3);transform:translateY(-1px)}
.chips button.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 18px rgba(124,77,255,.55)}
.chips button b{font-weight:600;margin-left:5px;font-size:11.5px;opacity:.72}
.chips button.zero{opacity:.34;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;align-items:center}
.bar input{flex:1 1 260px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:rgba(255,255,255,.05);color:#fff;outline:0;font-family:inherit}
.bar select,.bar button{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:#dfe5ff;font-size:13px;outline:0;font-family:inherit;cursor:pointer}
.bar input:focus,.bar select:focus{border-color:var(--a);box-shadow:0 0 14px rgba(0,229,255,.35)}
.bar option{background:#12183a}
#reset{color:#ffd0e4;border-color:rgba(255,79,163,.45)}
#reset:hover{background:rgba(255,79,163,.16)}
.cnt{text-align:center;color:#7f8cba;margin:16px 0 14px;font-size:13px}
.cnt b{color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px}
.card{position:relative;border-radius:18px;background:var(--glass);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card:hover{border-color:rgba(0,229,255,.65);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 26px rgba(0,229,255,.22);transform:translateY(-3px);transition:.25s}
.cv{aspect-ratio:16/9;background:linear-gradient(135deg,#16204a,#0d1230);position:relative;overflow:hidden}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .cv img{transform:scale(1.07)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(7,11,26,.88))}
.tag{position:absolute;left:10px;top:10px;z-index:1;font-size:11px;padding:2px 10px;border-radius:999px;color:#04121e;background:linear-gradient(90deg,var(--a),#7ef7ff);letter-spacing:1px}
.tag.l{background:linear-gradient(90deg,var(--p),#ff9ac9)}
.play{position:absolute;z-index:1;right:12px;bottom:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,229,255,.9);color:#041022;font-size:13px;opacity:0;transform:scale(.6);transition:.3s;box-shadow:0 0 18px var(--a)}
.card:hover .play{opacity:1;transform:scale(1)}
.bd{padding:12px 14px 13px;flex:1;display:flex;flex-direction:column}
.bd h3{margin:0 0 6px;font-size:15px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{margin:0 0 9px;color:#8e9bc8;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.pills span{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#a8b4dd}
.pills span.k{color:#8ef7dd;border-color:rgba(56,242,160,.3);background:rgba(56,242,160,.07)}
.meta{margin-top:auto;font-size:11.5px;color:#7f8cba;display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta .go{color:var(--a);white-space:nowrap}
.alt{color:#9aa6d6;white-space:nowrap;cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.28);padding-bottom:1px}
.alt:hover{color:#fff;border-bottom-color:var(--a)}
.card:hover .go{text-shadow:0 0 10px var(--a)}
.more{display:block;margin:32px auto 18px;padding:12px 54px;border:0;border-radius:999px;color:#fff;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 24px rgba(124,77,255,.5);font-family:inherit}
.more:hover{transform:scale(1.05);box-shadow:0 0 34px rgba(0,229,255,.6)}
.empty{grid-column:1/-1;text-align:center;color:#7f8cba;padding:64px 0}
footer{position:relative;z-index:1;text-align:center;color:#5d6a98;padding:26px;font-size:12px}
#top{position:fixed;right:20px;bottom:20px;z-index:9;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(10,16,38,.8);color:var(--a);cursor:pointer;font-size:17px}
@media(max-width:640px){.lbl{flex-basis:100%;padding-bottom:2px}.grp{flex-direction:column;gap:4px}.bar input{flex:1 1 100%}}
</style></head><body>
<canvas id="bg"></canvas><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">
<header><div class="eyebrow">Digital Literacy &amp; Skills · Navigator</div><h1>全民数字素养与技能教育</h1>
<p>按年龄、职业、内容三个维度筛选全民数字素养与技能教育资源。图标卡片的「播放视频」指向表格中的<b>视频链接（MP4 直链）</b>；卡片上的「原站页」可跳转平台原始页面。讲座收录 2026 年度。</p>
<div class="stats">
<div class="stat"><b id="s1">0</b><span>资源总数</span></div>
<div class="stat"><b id="s2">0</b><span>视频课程</span></div>
<div class="stat"><b id="s3">0</b><span>2026 讲座</span></div>
<div class="stat"><b id="s4">0</b><span>内容分类</span></div>
</div></header>

<div class="panel">
  <div class="grp"><span class="lbl">类型</span><div class="chips" id="fType"></div></div>
  <div class="grp"><span class="lbl">年龄</span><div class="chips" id="fAge"></div></div>
  <div class="grp"><span class="lbl">职业</span><div class="chips" id="fJob"></div></div>
  <div class="grp"><span class="lbl">内容</span><div class="chips" id="fCat"></div></div>
  <div class="bar">
    <input id="q" placeholder="🔍 搜索标题 / 简介 / 讲者 / 关键词…">
    <select id="sort"><option value="new">最新优先</option><option value="hot">播放量优先</option><option value="title">标题排序</option></select>
    <button id="reset">清空筛选</button>
  </div>
</div>

<p class="cnt" id="cnt"></p>
<div class="grid" id="grid"></div>
<button class="more" id="more">加载更多</button>
</div>
<footer>资源版权归原平台所有 · 本页仅提供跳转链接</footer>
<button id="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<script src="stats-config.js"></script>
<script src="track.js"></script>
<script src="data.js"></script>
<script>
const AGE_ORDER=['儿童','青少年','青年人','中年人','老年人','成年人'];
const st={type:'',age:'',job:'',cat:'',q:'',sort:'new',page:1},PS=36;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=(arr,v)=>!v||(arr||[]).includes(v);
// 某一维度之外，其余条件是否满足
function pass(x,skip){
  if(skip!=='type'&&st.type&&x.t!==st.type)return false;
  if(skip!=='age'&&!has(x.a,st.age))return false;
  if(skip!=='job'&&!has(x.j,st.job))return false;
  if(skip!=='cat'&&!has(x.c,st.cat))return false;
  if(st.q){const q=st.q.toLowerCase();
    const hay=(x.n+' '+(x.d||'')+' '+(x.au||'')+' '+(x.a||[]).join(' ')+' '+(x.j||[]).join(' ')+' '+(x.k||[]).join(' ')+' '+(x.c||[]).join(' ')).toLowerCase();
    if(!hay.includes(q))return false;}
  return true;
}
function facet(key,allVals,skip){
  const F={type:'t',age:'a',job:'j',cat:'c'}[key];
  const pool=ITEMS.filter(x=>pass(x,skip));
  const m={};pool.forEach(x=>{((key==='type'?[x.t]:(x[F]||[]))).forEach(v=>m[v]=(m[v]||0)+1)});
  let vals=allVals&&key!=='type'?allVals.filter(v=>m[v]):Object.keys(m);
  if(!vals)vals=Object.keys(m);
  if(key==='age')vals=AGE_ORDER.filter(v=>vals.includes(v)).concat(vals.filter(v=>!AGE_ORDER.includes(v)));
  else vals.sort((a,b)=>(m[b]||0)-(m[a]||0));
  return vals.map(v=>`<button data-k="${key}" data-v="${esc(v)}" class="${st[key]===v?'on':''}${m[v]?'':' zero'}" ${m[v]?'':'disabled'}>${esc(v)}<b>${m[v]||0}</b></button>`);
}
const ALL={type:['课程','讲座']};
function renderChips(){
  $('fType').innerHTML=`<button data-k="type" data-v="" class="${st.type?'':'on'}">全部<b>${ITEMS.length}</b></button>`+facet('type',ALL.type,'type');
  $('fAge').innerHTML=`<button data-k="age" data-v="" class="${st.age?'':'on'}">不限</button>`+facet('age',AGE_ORDER,'age');
  $('fJob').innerHTML=`<button data-k="job" data-v="" class="${st.job?'':'on'}">不限</button>`+facet('job',null,'job');
  $('fCat').innerHTML=`<button data-k="cat" data-v="" class="${st.cat?'':'on'}">不限</button>`+facet('cat',null,'cat');
}
document.querySelector('.panel').addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b||b.disabled)return;
  st[b.dataset.k]=b.dataset.v===''?'':(st[b.dataset.k]===b.dataset.v?'':b.dataset.v);
  st.page=1;render();
});
$('q').oninput=e=>{st.q=e.target.value.trim();st.page=1;render()};
$('sort').onchange=e=>{st.sort=e.target.value;render()};
$('reset').onclick=()=>{st.type=st.age=st.job=st.cat=st.q='';st.page=1;$('q').value='';$('sort').value='new';render()};
$('more').onclick=()=>{st.page++;render(true)};
$('grid').addEventListener('click',e=>{const a=e.target.closest('[data-pg]');if(!a)return;e.preventDefault();e.stopPropagation();window.open(a.getAttribute('data-pg'),'_blank','noopener')});
function count(el,to){let n=0,s=Math.max(1,Math.ceil(to/40));const t=setInterval(()=>{n=Math.min(to,n+s);el.textContent=n;if(n>=to)clearInterval(t)},18)}
count($('s1'),ITEMS.length);count($('s2'),ITEMS.filter(i=>i.t==='课程').length);count($('s3'),ITEMS.filter(i=>i.t==='讲座').length);
count($('s4'),new Set(ITEMS.flatMap(i=>i.c)).size);

function render(keepScroll){
  renderChips();
  let list=ITEMS.filter(x=>pass(x,null));
  list.sort(st.sort==='hot'?(a,b)=>(b.p||0)-(a.p||0):st.sort==='title'?(a,b)=>String(a.n).localeCompare(String(b.n),'zh'):(a,b)=>String(b.dt||'').localeCompare(String(a.dt||'')));
  $('cnt').innerHTML=`匹配到 <b>${list.length}</b> 条资源`;
  const v=list.slice(0,st.page*PS);
  $('grid').innerHTML=v.length?v.map(x=>{
    const pills=[...(x.a||[]).slice(0,2),...(x.j||[]).slice(0,2)].map(t=>`<span>${esc(t)}</span>`).join('')
      +((x.k||[]).slice(0,2).map(t=>`<span class="k">${esc(t)}</span>`).join(''));
    const sub=x.d?esc(x.d).slice(0,90):'';
    const right=x.t==='课程'?`<span>${esc(x.au||'—')}</span>`:`<span>${esc(x.dt||'')}</span>`;
    return `<a class="card" href="${esc(x.u)}" data-id="${esc(x.i)}" target="_blank" rel="noopener noreferrer">
      <div class="cv">${x.cv?`<img src="${esc(x.cv)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}
      <span class="tag ${x.t==='讲座'?'l':''}">${x.t}</span><span class="play">▶</span></div>
      <div class="bd"><h3>${esc(x.n)}</h3><p>${sub}</p>
      <div class="pills">${pills}</div>
      <div class="meta">${right}${x.pg&&x.u!==x.pg?`<span class="alt" data-pg="${esc(x.pg)}">原站页</span>`:''}<span class="go">${x.u!==x.pg?'播放视频 ›':'前往原站 ›'}</span></div></div></a>`;
  }).join(''):'<div class="empty">没有匹配的资源，试试放宽条件</div>';
  $('more').style.display=v.length<list.length?'block':'none';
  if(!keepScroll)window.scrollTo({top:0,behavior:'smooth'});
}
render();
// 埋点：卡片点击 / 搜索关键词 / 筛选点击（采集端未就绪时全部跳过）
(function(){
  const T=window.ColaStat; if(!T||!T.on) return;
  const BY=new Map(ITEMS.map(x=>[x.i,x]));
  const pack=(x,target)=>({id:x.i||'',n:x.n||'',t:x.t||'',ser:x.t==='讲座'?((x.c||[])[0]||''):'',cat:(x.c||[]).join('、'),target:target});
  document.addEventListener('click',e=>{
    const alt=e.target.closest('[data-pg]');
    if(alt){const c=alt.closest('.card');const x=(c&&BY.get(c.dataset.id))||{};T.send('click',{item:pack(x,'page')});return;}
    const c=e.target.closest('.card'); if(!c)return;
    const x=BY.get(c.dataset.id)||{};
    T.send('click',{item:pack(x,x.u!==x.pg?'mp4':'page')});
  },true);
  const pn=document.querySelector('.panel');
  if(pn)pn.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;T.send('filter',{dim:b.dataset.k,val:b.dataset.v||'不限'});},true);
  const q=$('q'); let tq;
  if(q)q.addEventListener('input',()=>{clearTimeout(tq);tq=setTimeout(()=>{const kw=q.value.trim();if(kw)T.send('search',{kw:kw,n:ITEMS.filter(x=>pass(x,null)).length});},1000)});
})();
// 粒子背景
(function(){const cv=$('bg'),x=cv.getContext('2d');let W,H,P=[];const m={x:-999,y:-999};
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(80,W/18|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
 addEventListener('resize',rs);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});rs();
 (function f(){x.clearRect(0,0,W,H);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
   x.fillStyle='rgba(0,229,255,.65)';x.beginPath();x.arc(p.x,p.y,1.4,0,7);x.fill()}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
   if(d<128){x.strokeStyle=`rgba(124,77,255,${.32*(1-d/128)})`;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
  for(const p of P){const d=Math.hypot(p.x-m.x,p.y-m.y);
   if(d<165){x.strokeStyle=`rgba(255,79,163,${.55*(1-d/165)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke()}}
  requestAnimationFrame(f)})()})();
</script></body></html>
