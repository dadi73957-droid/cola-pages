<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息素养资源导航 · 按适合人群</title>
<style>
:root{--a:#00e5ff;--b:#7c4dff;--p:#ff4fa3;--bg:#070b1a;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:14px/1.6 "Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:#e8ecff;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
.o1{width:520px;height:520px;background:var(--b);left:-120px;top:-100px}
.o2{width:460px;height:460px;background:#00b8d4;right:-100px;top:25%;animation-delay:-6s}
.o3{width:400px;height:400px;background:var(--p);left:35%;bottom:-160px;animation-delay:-12s;opacity:.3}
@keyframes float{50%{transform:translate(60px,40px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 24px}
header{padding:64px 0 20px;text-align:center}
header .eyebrow{letter-spacing:.4em;font-size:12px;color:var(--a);text-transform:uppercase}
header h1{margin:10px 0 12px;font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--b),var(--p),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
header p{margin:0 auto;max-width:720px;color:#9aa6d6}
.stats{display:flex;justify-content:center;gap:14px;margin:26px 0 8px;flex-wrap:wrap}
.stat{padding:12px 26px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);min-width:130px}
.stat b{display:block;font-size:30px;line-height:1.1;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:#8e9bc8}
.panel{position:relative;z-index:5;padding:14px 0 6px}
.aud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.aud button{position:relative;border:1px solid var(--line);background:var(--glass);color:#cfd6ff;border-radius:999px;padding:9px 20px;cursor:pointer;font-size:14px;backdrop-filter:blur(10px);transition:.25s}
.aud button:hover{border-color:var(--a);box-shadow:0 0 18px rgba(0,229,255,.35);transform:translateY(-2px)}
.aud button.on{color:#fff;border-color:transparent;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 24px rgba(124,77,255,.6)}
.aud b{font-weight:600;margin-left:6px;font-size:12px;opacity:.75}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 12px}
.bar input,.bar select{padding:10px 16px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:var(--glass);color:#fff;outline:0;backdrop-filter:blur(10px);transition:.2s}
.bar input{width:300px}.bar input:focus,.bar select:focus{border-color:var(--a);box-shadow:0 0 14px rgba(0,229,255,.4)}
.bar option{background:#12183a}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.chips span{padding:3px 14px;border-radius:999px;border:1px solid var(--line);color:#9aa6d6;cursor:pointer;font-size:12.5px;transition:.2s}
.chips span:hover{color:#fff;border-color:var(--p)}.chips span.on{color:#fff;background:rgba(255,79,163,.25);border-color:var(--p);box-shadow:0 0 12px rgba(255,79,163,.45)}
.cnt{text-align:center;color:#7f8cba;margin:14px 0 18px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;perspective:1200px}
.card{--mx:50%;--my:50%;position:relative;border-radius:18px;background:var(--glass);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;backdrop-filter:blur(14px);transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .3s,border-color .3s;}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(0,229,255,.22),transparent 60%)}
.card:hover{border-color:rgba(0,229,255,.7);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 28px rgba(0,229,255,.25)}
.card:hover::before{opacity:1}
.cv{aspect-ratio:16/9;background:#141b3d center/cover no-repeat;position:relative;overflow:hidden}
.cv i{position:absolute;inset:0;background:inherit;background-size:cover;background-position:center;transition:transform .6s}
.card:hover .cv i{transform:scale(1.1)}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(7,11,26,.9))}
.tag{position:absolute;left:10px;top:10px;z-index:1;font-size:11px;padding:2px 10px;border-radius:999px;color:#fff;background:linear-gradient(90deg,var(--b),var(--p));letter-spacing:1px}
.tag.l{background:linear-gradient(90deg,#00b8d4,var(--b))}
.play{position:absolute;z-index:1;right:12px;bottom:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,229,255,.9);color:#041022;font-size:14px;opacity:0;transform:scale(.6);transition:.3s;box-shadow:0 0 20px var(--a)}
.card:hover .play{opacity:1;transform:scale(1)}
.bd{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
.bd h3{margin:0 0 6px;font-size:15px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{margin:0 0 10px;color:#8e9bc8;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin-top:auto;font-size:12px;color:#7f8cba;display:flex;justify-content:space-between;gap:8px;align-items:center}
.go{color:var(--a);white-space:nowrap;transition:.25s}.card:hover .go{letter-spacing:1px;text-shadow:0 0 10px var(--a)}
.more{display:block;margin:34px auto 20px;padding:12px 56px;border:0;border-radius:999px;color:#fff;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--b),var(--a));box-shadow:0 0 26px rgba(124,77,255,.55);transition:.25s}
.more:hover{transform:scale(1.06);box-shadow:0 0 38px rgba(0,229,255,.7)}
.empty{grid-column:1/-1;text-align:center;color:#7f8cba;padding:60px 0}
footer{position:relative;z-index:1;text-align:center;color:#5d6a98;padding:30px;font-size:12px}
#top{position:fixed;right:22px;bottom:22px;z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--a);cursor:pointer;backdrop-filter:blur(10px);font-size:18px}
@media(max-width:600px){.bar input{width:100%}header{padding-top:40px}}
.card,.stat,.aud button,.bar input,.bar select{backdrop-filter:none!important}</style></head><body>
<canvas id="bg"></canvas><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<div class="wrap">
<header><div class="eyebrow">Information Literacy · Navigator</div><h1>信息素养资源导航</h1>
<p>按适合人群，一键直达全民数字素养与技能教育资源。本平台不播放视频，点击卡片即跳转至原网站对应页面观看。</p>
<div class="stats"><div class="stat"><b id="s1">0</b><span>资源总数</span></div><div class="stat"><b id="s2">0</b><span>视频课程</span></div><div class="stat"><b id="s3">0</b><span>讲座回放</span></div><div class="stat"><b id="s4">9</b><span>适合人群</span></div></div></header>
<div class="panel"><div class="aud" id="aud"></div>
<div class="bar"><input id="q" placeholder="🔍 搜索标题 / 简介 / 作者…"><select id="type"><option value="">全部类型</option><option>课程</option><option>讲座</option></select>
<select id="sort"><option value="new">最新创建</option><option value="hot">播放量最高</option></select></div>
<div class="chips" id="chips"></div></div>
<p class="cnt" id="cnt"></p><div class="grid" id="grid"></div>
<button class="more" id="more">加载更多</button>
</div><footer>资源版权归原平台所有 · 本页仅提供跳转链接</footer>
<button id="top" onclick="scrollTo({top:0})">↑</button>
<script src="data.js"></script>
<script>
const A=['社区居民（通用）','银龄读者','中小学生与青少年','学龄前儿童与亲子家长','大学生','科研与教研人员','职场人士','创业者','图书馆员与信息素养教育工作者'];
const st={aud:'全部',cat:'',page:1},PS=48;
const $=id=>document.getElementById(id);
const cnt=a=>ITEMS.filter(i=>a=='全部'||i.aud.includes(a)).length;
function count(el,to){let n=0,s=Math.max(1,Math.ceil(to/40));const t=setInterval(()=>{n=Math.min(to,n+s);el.textContent=n;if(n>=to)clearInterval(t)},20)}
count($('s1'),ITEMS.length);count($('s2'),ITEMS.filter(i=>i.t=='课程').length);count($('s3'),ITEMS.filter(i=>i.t=='讲座').length);
function nav(){$('aud').innerHTML=['全部',...A].map(a=>`<button class="${a==st.aud?'on':''}" data-a="${a}">${a}<b>${cnt(a)}</b></button>`).join('')}
$('aud').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.aud=b.dataset.a;st.cat='';st.page=1;render()};
$('chips').onclick=e=>{const s=e.target.closest('span');if(!s)return;st.cat=s.dataset.c;st.page=1;render()};
['q','type','sort'].forEach(i=>$(i).oninput=()=>{st.page=1;render()});
$('more').onclick=()=>{st.page++;render()};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){nav();
 const base=ITEMS.filter(i=>st.aud=='全部'||i.aud.includes(st.aud));
 const cats={};base.forEach(i=>i.cat.forEach(c=>cats[c]=(cats[c]||0)+1));
 $('chips').innerHTML=`<span data-c="" class="${st.cat?'':'on'}">全部分类</span>`+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<span data-c="${esc(c)}" class="${c==st.cat?'on':''}">${esc(c)} ${n}</span>`).join('');
 const q=$('q').value.trim().toLowerCase(),t=$('type').value;
 let l=base.filter(i=>(!st.cat||i.cat.includes(st.cat))&&(!t||i.t==t)&&(!q||(i.title+(i.desc||'')+(i.author||'')+(i.speaker||'')).toLowerCase().includes(q)));
 l.sort($('sort').value=='hot'?(a,b)=>(b.plays||0)-(a.plays||0):(a,b)=>String(b.created).localeCompare(String(a.created)));
 $('cnt').textContent=`共 ${l.length} 条`;
 const v=l.slice(0,st.page*PS);
 $('grid').innerHTML=v.length?v.map((i,k)=>{const u=`${BASE}/${i.t=='课程'?'course':'lecture'}/${i.id}`;
  const sub=i.t=='课程'?`${esc(i.author)||'—'}${i.dur&&i.dur!='未获取'?' · '+esc(i.dur):''}`:`${esc(i.speaker)} ${esc(i.unit)}`;
  const d=i.t=='课程'?i.desc:i.date;
  return `<a class="card" style="animation-delay:${(k%12)*40}ms" href="${u}" target="_blank" rel="noopener noreferrer"><div class="cv"><i style="background-image:url('${esc(i.cover)}')"></i><span class="tag ${i.t=='讲座'?'l':''}">${i.t}</span><span class="play">▶</span></div><div class="bd"><h3>${esc(i.title)}</h3><p>${esc(d)}</p><div class="meta"><span>${sub}</span><span class="go">前往观看 ›</span></div></div></a>`}).join(''):'<div class="empty">没有匹配的资源</div>';
 $('more').style.display=v.length<l.length?'block':'none'}
$('grid').addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
 c.style.transform=`rotateY(${(x/r.width-.5)*10}deg) rotateX(${-(y/r.height-.5)*10}deg) translateZ(8px)`});
$('grid').addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c)c.style.transform=''});
render();
// particle network background
(function(){const cv=$('bg'),x=cv.getContext('2d');let W,H,P=[];const m={x:-999,y:-999};
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(90,W/16|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
 addEventListener('resize',rs);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});rs();
 (function f(){x.clearRect(0,0,W,H);for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;x.fillStyle='rgba(0,229,255,.7)';x.beginPath();x.arc(p.x,p.y,1.5,0,7);x.fill()}
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){x.strokeStyle=`rgba(124,77,255,${.35*(1-d/130)})`;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
  for(const p of P){const d=Math.hypot(p.x-m.x,p.y-m.y);if(d<170){x.strokeStyle=`rgba(255,79,163,${.6*(1-d/170)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(m.x,m.y);x.stroke()}}
  requestAnimationFrame(f)})()})();
</script></body></html>
